          package com.factory.shell

          import android.Manifest
          import android.app.Activity
          import android.app.DownloadManager
          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.webkit.PermissionRequest
          import android.webkit.URLUtil
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.webkit.WebViewAssetLoader

          /** Generic shell: runs the zipped web project (assets/www/index.html) as a full-screen app. */
          class MainActivity : Activity() {
              private lateinit var wv: WebView
              private var fileCb: ValueCallback<Array<Uri>>? = null
              private var pendingPerm: PermissionRequest? = null

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  wv = WebView(this)
                  setContentView(wv)
                  val loader = WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", WebViewAssetLoader.AssetsPathHandler(this)).build()
                  wv.settings.apply {
                      javaScriptEnabled = true; domStorageEnabled = true; databaseEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  }
                  wv.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(v: WebView, r: WebResourceRequest) = loader.shouldInterceptRequest(r.url)
                      override fun shouldOverrideUrlLoading(v: WebView, r: WebResourceRequest): Boolean {
                          val s = r.url.scheme
                          if (s == "http" || s == "https") return false
                          try { startActivity(Intent(Intent.ACTION_VIEW, r.url)) } catch (_: ActivityNotFoundException) {}
                          return true
                      }
                  }
                  wv.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(req: PermissionRequest) {
                          runOnUiThread {
                              val need = ArrayList<String>()
                              for (r in req.resources) {
                                  if (r == PermissionRequest.RESOURCE_VIDEO_CAPTURE) need.add(Manifest.permission.CAMERA)
                                  if (r == PermissionRequest.RESOURCE_AUDIO_CAPTURE) need.add(Manifest.permission.RECORD_AUDIO)
                              }
                              val missing = need.filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
                              if (missing.isEmpty()) req.grant(req.resources)
                              else { pendingPerm = req; requestPermissions(missing.toTypedArray(), 77) }
                          }
                      }
                      override fun onShowFileChooser(v: WebView, cb: ValueCallback<Array<Uri>>, p: FileChooserParams): Boolean {
                          fileCb?.onReceiveValue(null); fileCb = cb
                          return try { startActivityForResult(p.createIntent(), 78); true } catch (e: Exception) { fileCb = null; false }
                      }
                  }
                  wv.setDownloadListener { url, ua, cd, mime, _ ->
                      try {
                          val r = DownloadManager.Request(Uri.parse(url)).setMimeType(mime).addRequestHeader("User-Agent", ua)
                              .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                              .setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, URLUtil.guessFileName(url, cd, mime))
                          (getSystemService(DOWNLOAD_SERVICE) as DownloadManager).enqueue(r)
                      } catch (_: Exception) {}
                  }
                  wv.loadUrl("https://appassets.androidplatform.net/assets/www/index.html")
              }

              override fun onRequestPermissionsResult(rc: Int, p: Array<out String>, g: IntArray) {
                  super.onRequestPermissionsResult(rc, p, g)
                  if (rc == 77) {
                      val req = pendingPerm; pendingPerm = null
                      if (req != null) { if (g.isNotEmpty() && g.all { it == PackageManager.PERMISSION_GRANTED }) req.grant(req.resources) else req.deny() }
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(rc: Int, res: Int, data: Intent?) {
                  if (rc == 78) { fileCb?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data)); fileCb = null }
                  else super.onActivityResult(rc, res, data)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() { if (wv.canGoBack()) wv.goBack() else super.onBackPressed() }
              override fun onPause() { super.onPause(); wv.onPause() }
              override fun onResume() { super.onResume(); wv.onResume() }
          }
          __EOF__
          cat > scripts/build_one.sh <<'__EOF__'
          #!/usr/bin/env bash
          # Usage: build_one.sh inbox/<name>.zip  -> GitHub Release with the APK (or a "fail-" release holding the error text)
          set -uo pipefail
          REPO="$(pwd)"; ZIP="$REPO/$1"
          NAME="$(basename "$1" .zip)"
          HASH="$(sha256sum "$ZIP" | cut -c1-8)"
          CLEAN="$(printf '%s' "$NAME" | sed 's/[^A-Za-z0-9 ._-]//g')"; [ -n "$CLEAN" ] || CLEAN="App"
          SLUG="$(printf '%s' "$NAME" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]\+/-/g;s/^-//;s/-$//')"; SLUG="${SLUG:-app-$HASH}"
          APPID="com.factory.a$(printf '%s' "$SLUG" | tr -d '-')"
          TAG="$SLUG-$HASH"
          W="$(mktemp -d)"; LOG="$W/build.log"; : > "$LOG"

          fail() {  # $1 = short reason. Publishes the error so the web page can show it.
            echo "❌ $1"; tail -n 40 "$LOG"
            { echo "FAILED-BUILD for: $NAME.zip"; echo; echo "$1"; echo
              { grep -E '^e: ' "$LOG" | head -20; grep -A8 'What went wrong' "$LOG" | head -14; } | cut -c1-240
            } > "$W/fail.txt"
            gh release delete "fail-$TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1
            gh release create "fail-$TAG" -R "$GITHUB_REPOSITORY" --prerelease --title "FAILED: $CLEAN" --notes-file "$W/fail.txt" >/dev/null 2>&1
            exit 1
          }

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "✓ already built: $TAG"; exit 0; fi
          echo "=== Building $NAME ($TAG)"

          mkdir "$W/src"; unzip -q "$ZIP" -d "$W/src" || fail "ZIP খোলা যায়নি (ফাইল নষ্ট?)"
          rm -rf "$W/src/__MACOSX"
          ROOT="$W/src"
          while [ "$(ls -A "$ROOT" | wc -l)" -eq 1 ] && [ -d "$ROOT/$(ls -A "$ROOT")" ]; do ROOT="$ROOT/$(ls -A "$ROOT")"; done
          OUT="$W/$SLUG.apk"

          if [ -f "$ROOT/settings.gradle" ] || [ -f "$ROOT/settings.gradle.kts" ]; then
            MODE="android-project"
            cd "$ROOT"
            if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon > "$LOG" 2>&1 || fail "Gradle build ব্যর্থ"
            else gradle assembleDebug --no-daemon > "$LOG" 2>&1 || fail "Gradle build ব্যর্থ"; fi
            tail -n 15 "$LOG"
            APK="$(find . -path '*/outputs/apk/debug/*.apk' ! -name '*androidTest*' | sort | head -1)"
            [ -n "$APK" ] || fail "বিল্ড শেষ হয়েছে কিন্তু APK ফাইল পাওয়া যায়নি"
            cp "$APK" "$OUT"
          else
            IDX="$(find "$W/src" -maxdepth 4 -name index.html | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)"
            [ -n "$IDX" ] || fail "ZIP-এ Gradle প্রজেক্ট বা index.html কোনোটাই নেই"
            MODE="web-app"
            WWW="$REPO/webshell/app/src/main/assets/www"; rm -rf "$WWW"; mkdir -p "$WWW"
            cp -r "$(dirname "$IDX")/." "$WWW/"
            cd "$REPO/webshell"
            gradle assembleDebug --no-daemon -PappId="$APPID" -PappName="$CLEAN" -Pvcode="$(( $(date +%s) / 60 ))" > "$LOG" 2>&1 || fail "Gradle build ব্যর্থ"
            tail -n 15 "$LOG"
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT" || fail "APK ফাইল পাওয়া যায়নি"
          fi

          # Same signing key for every build => new versions install over old ones.
          AS="$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$AS" ]; then
            "$AS" sign --ks "$REPO/factory.jks" --ks-pass pass:factory123 --key-pass pass:factory123 \
              --v4-signing-enabled false --out "$OUT.signed" "$OUT" && mv "$OUT.signed" "$OUT"
          fi

          if ! gh release create "$TAG" "$OUT" -R "$GITHUB_REPOSITORY" --title "$CLEAN" --notes "mode: $MODE • source: $NAME.zip"; then
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "already published by another run"; exit 0; }
            fail "রিলিজ তৈরি করা যায়নি"
          fi
          gh release delete "fail-$TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1
          echo "✅ Done: $TAG"
          __EOF__
          chmod +x scripts/build_one.sh
      - name: Build every new ZIP in inbox/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          FAIL=0
          for z in inbox/*.zip; do
            bash scripts/build_one.sh "$z" || FAIL=1
          done
          exit $FAIL
